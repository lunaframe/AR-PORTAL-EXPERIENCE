<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="portal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#050008"/>
      <stop offset="50%" stop-color="#190638"/>
      <stop offset="85%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#050008"/>
  <!-- Outer glowing rings -->
  <circle cx="50" cy="50" r="38" stroke="url(#ring-grad)" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="33" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="50" cy="50" r="28" fill="url(#portal-glow)"/>
  <!-- Swirl arms -->
  <path d="M50 25 C62 25, 75 38, 75 50 C75 60, 65 72, 50 72 C38 72, 28 62, 28 50 C28 42, 35 34, 44 34 C49 34, 55 38, 55 45 C55 49, 52 53, 48 53 C46 53, 44 51, 45 49"
        stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M50 75 C38 75, 25 62, 25 50 C25 40, 35 28, 50 28 C62 28, 72 38, 72 50 C72 58, 65 66, 56 66 C51 66, 45 62, 45 55 C45 51, 48 47, 52 47 C54 47, 56 49, 55 51"
        stroke="#06b6d4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Core singularity -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#glow)"/>
</svg>
